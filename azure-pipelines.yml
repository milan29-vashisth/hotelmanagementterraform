trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

# =========================
# TERRAFORM STAGE
# =========================
- stage: TerraformDeploy
  displayName: "Terraform Infrastructure Deployment"

  jobs:
  - job: DeployInfra
    displayName: "Deploy App Service Infra"

    steps:

    - checkout: self

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    # Terraform Commands
    - task: AzureCLI@2
      displayName: "Terraform Init Plan Apply"

      inputs:
        azureSubscription: 'app-hotel-coonection'
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          terraform version

          terraform init

          terraform validate

          terraform plan -var-file="environments/dev/terraform.tfvars"

          terraform apply -auto-approve -var-file="environments/dev/terraform.tfvars"