trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Terraform_Validate
  jobs:
  - job: Validate
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: latest

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'app-hotel-coonection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform init
          terraform validate

- stage: Terraform_Plan
  dependsOn: Terraform_Validate
  jobs:
  - job: Plan
    steps:

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'app-hotel-coonection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform plan \
          -var="resource_group_name=app-test-dev-rg" \
          -var="location=East US" \
          -var="app_service_plan_name=hotel-dev-plan" \
          -var="app_service_name=milanhotelapp2026"

- stage: Terraform_Apply
  dependsOn: Terraform_Plan
  jobs:
  - job: Apply
    steps:

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'app-hotel-coonection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform apply -auto-approve \
          -var="resource_group_name=app-test-dev-rg" \
          -var="location=East US" \
          -var="app_service_plan_name=hotel-dev-plan" \
          -var="app_service_name=milanhotelapp2026"