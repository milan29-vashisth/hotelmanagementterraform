trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.9.5'

stages:

- stage: Terraform
  displayName: Terraform Deployment

  jobs:
  - job: TerraformApply
    displayName: Terraform Init Plan Apply

    steps:

    # Install Terraform
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(terraformVersion)

    # Terraform Init
    - task: TerraformTaskV4@4
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'

        # Azure DevOps Service Connection
        backendServiceArm: 'app-hotel-coonection'

        # Backend Configuration
        backendAzureRmResourceGroupName: 'tfstate-rg-milan'
        backendAzureRmStorageAccountName: 'milantfstate2026'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'hotel-dev.tfstate'

        workingDirectory: '$(System.DefaultWorkingDirectory)'

    # Terraform Validate
    - task: TerraformTaskV4@4
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)'

    # Terraform Plan
    - task: TerraformTaskV4@4
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'

        environmentServiceNameAzureRM: 'app-hotel-coonection'

        commandOptions: >
          -var-file=environments/dev/terraform.tfvars

        workingDirectory: '$(System.DefaultWorkingDirectory)'

    # Terraform Apply
    - task: TerraformTaskV4@4
      displayName: Terraform Apply
      inputs:
        provider: 'azurerm'
        command: 'apply'

        environmentServiceNameAzureRM: 'app-hotel-coonection'

        commandOptions: >
          -auto-approve
          -var-file=environments/dev/terraform.tfvars
        workingDirectory: '$(System.DefaultWorkingDirectory)'
